<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">撕标签 · Wander — 116 张去标签产品 PNG 与 21 组桌面静物合集</title>
  <desc id="desc">暖白底标题：撕标签 Wander；右侧是一只正在撕掉标签的瓶子，标签一角卷起，旁边还有小罐与软管。</desc>

  <rect width="1200" height="360" rx="26" fill="#faf9f6"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="56" y="62" font-size="19" letter-spacing="3" fill="#556b2f">TEAR LABELS · WANDER</text>
    <text x="56" y="128" font-size="62" font-weight="700" fill="#1c1917">撕标签 · Wander</text>
    <text x="56" y="168" font-size="23" fill="#292524">116 张去标签产品 PNG + 21 组桌面静物合集</text>
    <text x="56" y="204" font-size="19" fill="#57534e">去掉包装标签，留下形状、材质和一点生活的美。</text>
    <g id="chips" font-size="18" fill="#292524" text-anchor="middle">
      <g><rect x="56" y="238" width="132" height="36" rx="18" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5"/><text x="122" y="262">116 张产品图</text></g>
      <g><rect x="200" y="238" width="144" height="36" rx="18" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5"/><text x="272" y="262">21 组静物合集</text></g>
      <g><rect x="356" y="238" width="108" height="36" rx="18" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5"/><text x="410" y="262">白底 PNG</text></g>
      <g><rect x="476" y="238" width="126" height="36" rx="18" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5"/><text x="539" y="262">原图下载</text></g>
    </g>
  </g>

  <g id="bottle-motif">
    <g id="jar" transform="translate(838 208)">
      <rect x="0" y="26" width="64" height="76" rx="10" fill="#e7e5e4" stroke="#78716c" stroke-width="2"/>
      <rect x="10" y="10" width="44" height="20" rx="6" fill="#a8a29e"/>
    </g>
    <g id="tube" transform="translate(1090 196)">
      <rect x="0" y="0" width="52" height="96" rx="10" fill="#d6e8d0" stroke="#78716c" stroke-width="2"/>
      <rect x="14" y="96" width="24" height="14" rx="4" fill="#a8a29e"/>
    </g>
    <g id="bottle" transform="translate(930 52)">
      <rect x="35" y="28" width="40" height="36" fill="#dbeafe" stroke="#1c1917" stroke-width="2"/>
      <rect x="28" y="8" width="54" height="24" rx="6" fill="#556b2f"/>
      <rect x="0" y="58" width="110" height="184" rx="24" fill="#dbeafe" stroke="#1c1917" stroke-width="2"/>
      <rect x="12" y="118" width="86" height="72" rx="6" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5"/>
      <rect x="22" y="136" width="48" height="7" rx="3.5" fill="#d6d3d1"/>
      <rect x="22" y="152" width="62" height="7" rx="3.5" fill="#d6d3d1"/>
      <polygon points="98,118 132,96 132,142 98,156" fill="#f5f5f4" stroke="#a8a29e" stroke-width="1.5"/>
      <path d="M 132 96 Q 158 78 176 84" fill="none" stroke="#556b2f" stroke-width="3" stroke-linecap="round"/>
      <polygon points="176,84 164,80 170,94" fill="#556b2f"/>
    </g>
  </g>

  <g id="caption">
    <text x="985" y="330" font-size="18" fill="#556b2f" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">标签撕掉，产品留下</text>
  </g>
</svg>

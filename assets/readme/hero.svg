<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <title>撕标签 · 去品牌白底静物素材库 - Unbranded Objects &amp; Daily Necessities</title>
  <defs>
    <linearGradient id="bgGrad_daily-necessities-library" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E232A"/>
      <stop offset="100%" stop-color="#111418"/>
    </linearGradient>
    <linearGradient id="primaryGrad_daily-necessities-library" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad_daily-necessities-library)" stroke="#334155" stroke-width="1.5"/>

  <!-- Left Content Block -->
  <g transform="translate(60, 50)">
    <!-- Category Pill -->
    <rect x="0" y="0" width="350" height="28" rx="14" fill="#3B82F6" opacity="0.15"/>
    <text x="14" y="19" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#3B82F6" letter-spacing="1.5">DESIGN ASSET ARCHIVE &amp; MINIMALIST STUDIO</text>

    <!-- Main Title (Chinese) -->
    <text x="0" y="85" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="40" font-weight="900" fill="#F8FAFC" letter-spacing="-0.5">
      撕标签 · 去品牌白底静物素材库
    </text>

    <!-- Subtitle (English & Value Proposition) -->
    <text x="0" y="125" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#10B981" letter-spacing="0.5">
      Unbranded Objects &amp; Daily Necessities
    </text>

    <!-- Tagline Description -->
    <text x="0" y="170" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="16" font-weight="500" fill="#94A3B8">
      撕掉商业包装标签，76 张影棚级纯白底透明 PNG 物性设计素材
    </text>

    <!-- Key Spec Badge Array -->
    <g transform="translate(0, 225)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="509" height="38" rx="8" fill="#1E2430" stroke="#334155" stroke-width="1"/>
      <circle cx="18" cy="19" r="4" fill="#3B82F6"/>
      <text x="32" y="24" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#F8FAFC">76 ASSETS · 100% UNBRANDED · STUDIO TRANSPARENT PNG</text>
    </g>

    <!-- Navigation / Quick action badges -->
    <g transform="translate(0, 285)">
      <rect x="0" y="0" width="135" height="34" rx="17" fill="#3B82F6"/>
      <text x="67" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">TRY LIVE DEMO</text>

      <rect x="145" y="0" width="125" height="34" rx="17" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="207" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#94A3B8">GITHUB REPO</text>
    </g>
  </g>

  <!-- Right Visual Specimen Motif -->
  
        <!-- Daily Necessities Minimalist Studio Visual -->
        <g transform="translate(740, 45)">
          <rect x="0" y="0" width="380" height="310" rx="14" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
          
          <!-- Transparent Checkerboard Pattern Area -->
          <g opacity="0.15">
            <rect x="30" y="30" width="320" height="200" fill="#334155"/>
            <!-- Sub-checkers -->
            <rect x="30" y="30" width="20" height="20" fill="#64748B"/>
            <rect x="70" y="30" width="20" height="20" fill="#64748B"/>
            <rect x="110" y="30" width="20" height="20" fill="#64748B"/>
            <rect x="150" y="30" width="20" height="20" fill="#64748B"/>
            <rect x="190" y="30" width="20" height="20" fill="#64748B"/>
            <rect x="230" y="30" width="20" height="20" fill="#64748B"/>
            <rect x="270" y="30" width="20" height="20" fill="#64748B"/>
            <rect x="310" y="30" width="20" height="20" fill="#64748B"/>
          </g>

          <!-- Bottle Silhouette Vector -->
          <g transform="translate(145, 45)">
            <!-- Cap -->
            <rect x="35" y="10" width="20" height="15" rx="3" fill="#3B82F6"/>
            <!-- Neck -->
            <rect x="38" y="25" width="14" height="20" fill="#CBD5E1"/>
            <!-- Body -->
            <rect x="15" y="45" width="60" height="110" rx="8" fill="#F8FAFC"/>
            <!-- Peeled label corner indicator -->
            <path d="M15 80 L55 80 L55 125 L15 125 Z" fill="#E2E8F0" stroke="#F43F5E" stroke-width="1.5" stroke-dasharray="3 2"/>
            <polygon points="45,80 55,80 55,90" fill="#F43F5E"/>
            <!-- Soft Shadow -->
            <ellipse cx="45" cy="165" rx="35" ry="8" fill="#020617" opacity="0.6"/>
          </g>

          <!-- Measurement Calipers & Dimension Labels -->
          <line x1="120" y1="55" x2="120" y2="200" stroke="#3B82F6" stroke-width="1.5"/>
          <line x1="115" y1="55" x2="125" y2="55" stroke="#3B82F6" stroke-width="1.5"/>
          <line x1="115" y1="200" x2="125" y2="200" stroke="#3B82F6" stroke-width="1.5"/>
          <text x="110" y="130" text-anchor="end" font-family="system-ui, monospace" font-size="10" font-weight="700" fill="#3B82F6">H: 220mm</text>

          <!-- Bottom Status Pill -->
          <rect x="30" y="250" width="320" height="34" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
          <circle cx="50" cy="267" r="5" fill="#10B981"/>
          <text x="65" y="271" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#F8FAFC">100% UNBRANDED · CLEAN ALPHA PNG</text>
